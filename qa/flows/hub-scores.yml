schema: qawalk.scenario.v1
id: PLAYFUL-HUB-SCORES
title: Hub — high scores on the game cards
kind: flow
version: 1
locales: [en]
viewports:
  desktop: [1280, 800]
environments: [local, preview]
lanes: [Main path]
readonly: true

nodes:
  - id: hub
    kind: screen
    title: Game cards show high scores
    path: /
    purpose: The hub lists GTA Praha (featured and in the grid) plus Marooned, Crossy Road, and Traffic Run; live cards leave Loading; Crazy Vacuum stays hidden.
    page: landing
    execution:
      strategy: playwright
      script: steps/hub-scores.mjs
      instructions: Open the hub and wait until the live game cards leave Loading.
    criteria:
      - id: AC1
        text: GTA Praha, Marooned, Crossy Road, and Traffic Run cards are present; Crazy Vacuum is absent.
        check:
          type: deterministic
          assert: js_equals
          expression: "document.body.innerText.includes('GTA Praha') && document.body.innerText.includes('Marooned') && document.body.innerText.includes('Crossy Road') && document.body.innerText.includes('Traffic Run') && !document.body.innerText.includes('Crazy Vacuum') && document.querySelector('h3').textContent.trim() === 'GTA Praha'"
          value: true
      - id: AC2
        text: The GTA Praha card leaves Loading.
        check:
          type: deterministic
          assert: js_equals
          expression: "document.querySelector('h3').textContent.trim() === 'GTA Praha' && !document.querySelector('h3').parentElement.innerText.includes('Loading')"
          value: true
      - id: AC3
        text: The Marooned card shows a survival label (10h, 1d, or 1d 2h) plus a name.
        check:
          type: deterministic
          assert: text_matches
          selector: ".game-card"
          pattern: "(?:\\d+d(?: \\d+h)?|\\d+h) \\S"
      - id: AC4
        text: The Crossy Road card leaves Loading.
        check:
          type: deterministic
          assert: js_equals
          expression: "(() => { const h = [...document.querySelectorAll('h3')].find(el => el.textContent.trim() === 'Crossy Road'); if (!h) return false; const card = h.closest('.game-card'); return card && !card.innerText.includes('Loading'); })()"
          value: true
      - id: AC5
        text: The Traffic Run card leaves Loading.
        check:
          type: deterministic
          assert: js_equals
          expression: "(() => { const h = [...document.querySelectorAll('h3')].find(el => el.textContent.trim() === 'Traffic Run'); if (!h) return false; const card = h.closest('.game-card'); return card && !card.innerText.includes('Loading'); })()"
          value: true
      - id: AC6
        text: Featured Game hero is GTA Praha.
        check:
          type: deterministic
          assert: js_equals
          expression: "document.body.innerText.includes('Featured Game') && [...document.querySelectorAll('h2')].some(el => el.textContent.trim() === 'GTA Praha')"
          value: true

edges: []
